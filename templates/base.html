<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DRYDOWN — Perfume Vault{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}DRYDOWN — A minimal luxury perfume vault for logging, cataloging, and savoring every scent.{% endblock %}">

    <!-- Google Fonts: Syne (Headers) + JetBrains Mono (Metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Backgrounds
                        linen:    '#F7F5F0',
                        'linen-dark': '#EDE9E1',
                        espresso: '#18110D',

                        // Text
                        coffee:   '#1A1412',
                        'coffee-light': '#4A3F37',

                        // Accents
                        vanilla:  '#E8D8C8',
                        teal:     '#1C4E59',
                        'teal-light': '#257080',
                        amber:    '#D97736',
                        'amber-dark': '#B85E20',

                        // Utility
                        sand:     '#C4B9A8',
                        driftwood:'#8A7E70',
                    },
                    fontFamily: {
                        sans:  ['"Syne"', 'system-ui', 'sans-serif'],
                        mono:  ['"JetBrains Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        /* Smooth scrollbar & selection */
        ::selection { background: #D9773640; color: #1A1412; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Syne', sans-serif; }

        /* Subtle warm grain texture overlay */
        .grain-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Form styling */
        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background: #F7F5F0;
            border: 1px solid #C4B9A8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8125rem;
            color: #1A1412;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #1C4E59;
            box-shadow: 0 0 0 3px rgba(28, 78, 89, 0.1);
        }
        .form-input::placeholder { color: #8A7E70; }
        select.form-input { cursor: pointer; }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-linen text-coffee min-h-screen flex flex-col antialiased relative">

    <!-- Grain texture -->
    <div class="grain-overlay"></div>

    <!-- STICKY NAVIGATION -->
    <header class="sticky top-0 z-50 bg-linen/90 backdrop-blur-xl border-b border-sand/40" x-data="{ mobileOpen: false }">
        <div class="max-w-6xl mx-auto px-5 sm:px-8">
            <div class="flex items-center justify-between h-16 gap-6">

                <!-- Brand -->
                <div class="flex items-center gap-8 shrink-0">
                    <a href="{% url 'catalog:index' %}" class="flex items-center gap-2.5 group">
                        <div class="w-7 h-7 rounded-full bg-teal flex items-center justify-center group-hover:bg-amber transition-colors duration-300">
                            <span class="font-mono text-[9px] font-bold text-linen tracking-tight">DW</span>
                        </div>
                        <span class="font-sans text-lg font-bold tracking-[0.2em] uppercase text-coffee group-hover:text-teal transition-colors duration-200">
                            DRYDOWN
                        </span>
                    </a>

                    <!-- Desktop Nav -->
                    <nav class="hidden md:flex items-center gap-7 text-[11px] uppercase tracking-[0.15em] font-mono font-medium">
                        <a href="{% url 'catalog:index' %}" class="text-driftwood hover:text-teal transition-colors duration-150">Catalog</a>
                        <a href="{% url 'diary:index' %}" class="text-driftwood hover:text-teal transition-colors duration-150">Diary</a>
                        <a href="{% url 'accounts:wardrobe' %}" class="text-driftwood hover:text-teal transition-colors duration-150">Wardrobe</a>
                    </nav>
                </div>

                <!-- Search Bar (Alpine.js) -->
                <div
                    class="flex-1 max-w-sm relative hidden sm:block"
                    x-data="{
                        query: '',
                        results: [],
                        open: false,
                        loading: false,
                        async search() {
                            if (this.query.trim().length === 0) {
                                this.results = []; this.open = false; return;
                            }
                            this.loading = true; this.open = true;
                            try {
                                const res = await fetch(`{% url 'catalog:api_search' %}?q=${encodeURIComponent(this.query)}`);
                                const data = await res.json();
                                this.results = data.results || [];
                            } catch { this.results = []; }
                            finally { this.loading = false; }
                        }
                    }"
                    @click.outside="open = false"
                >
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-driftwood">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </div>
                        <input
                            type="text"
                            x-model="query"
                            @input.debounce.300ms="search()"
                            @focus="if (query.trim().length > 0) open = true"
                            placeholder="Search fragrances..."
                            class="w-full pl-9 pr-4 py-2 bg-linen-dark/60 text-xs font-mono text-coffee placeholder-driftwood rounded-full border border-sand/50 focus:outline-none focus:border-teal focus:ring-1 focus:ring-teal/20 transition-all duration-200"
                        >
                    </div>

                    <!-- Dropdown Results -->
                    <div
                        x-show="open"
                        x-transition:enter="transition ease-out duration-150"
                        x-transition:enter-start="opacity-0 -translate-y-1"
                        x-transition:enter-end="opacity-100 translate-y-0"
                        x-transition:leave="transition ease-in duration-100"
                        x-transition:leave-start="opacity-100 translate-y-0"
                        x-transition:leave-end="opacity-0 -translate-y-1"
                        class="absolute left-0 right-0 top-full mt-2 bg-white/95 backdrop-blur-xl border border-sand/40 rounded-lg shadow-xl shadow-coffee/5 overflow-hidden z-50"
                        style="display: none;"
                    >
                        <template x-if="loading && results.length === 0">
                            <div class="px-4 py-3 text-xs font-mono text-driftwood flex items-center gap-2">
                                <svg class="animate-spin w-3 h-3 text-amber" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                Searching...
                            </div>
                        </template>

                        <template x-if="!loading && results.length === 0 && query.trim().length > 0">
                            <div class="px-4 py-4 text-xs font-mono text-driftwood text-center">
                                No results for "<span x-text="query" class="text-coffee font-medium"></span>"
                            </div>
                        </template>

                        <template x-if="results.length > 0">
                            <div class="max-h-80 overflow-y-auto divide-y divide-sand/30">
                                <template x-for="item in results" :key="item.id">
                                    <a :href="item.url" class="flex items-center gap-3 px-4 py-2.5 hover:bg-vanilla/30 transition-colors group">
                                        <div class="w-8 h-8 bg-vanilla/50 rounded flex items-center justify-center shrink-0 overflow-hidden">
                                            <template x-if="item.image_url">
                                                <img :src="item.image_url" :alt="item.name" class="w-full h-full object-contain p-0.5">
                                            </template>
                                            <template x-if="!item.image_url">
                                                <svg class="w-3.5 h-3.5 text-driftwood" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                                            </template>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="text-sm font-sans font-semibold text-coffee group-hover:text-teal truncate transition-colors" x-text="item.name"></div>
                                            <div class="text-[11px] font-mono text-driftwood truncate" x-text="item.house"></div>
                                        </div>
                                        <svg class="w-3 h-3 text-sand group-hover:text-teal transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                    </a>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Right Actions -->
                <div class="flex items-center gap-3 shrink-0">
                    <a href="{% url 'catalog:fragrance_create' %}" class="hidden sm:inline-flex items-center gap-1.5 px-4 py-2 text-[11px] font-mono font-semibold tracking-wide uppercase bg-teal hover:bg-teal-light text-linen rounded-full shadow-sm hover:shadow-md transition-all duration-200">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                        Add
                    </a>

                    <!-- Mobile Menu Toggle -->
                    <button @click="mobileOpen = !mobileOpen" class="md:hidden p-2 text-driftwood hover:text-coffee">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path x-show="!mobileOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                            <path x-show="mobileOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mobile Nav Drawer -->
            <div x-show="mobileOpen" x-collapse class="md:hidden pb-5 pt-3 border-t border-sand/30 space-y-3">
                <form action="{% url 'catalog:index' %}" method="GET">
                    <input type="text" name="q" placeholder="Search..." class="w-full px-4 py-2.5 bg-linen-dark/60 text-xs font-mono text-coffee placeholder-driftwood rounded-full border border-sand/50 focus:outline-none focus:border-teal">
                </form>
                <div class="flex flex-col space-y-1 font-mono text-xs uppercase tracking-[0.12em]">
                    <a href="{% url 'catalog:index' %}" class="px-3 py-2 text-driftwood hover:text-teal rounded-lg hover:bg-vanilla/30">Catalog</a>
                    <a href="{% url 'diary:index' %}" class="px-3 py-2 text-driftwood hover:text-teal rounded-lg hover:bg-vanilla/30">Diary</a>
                    <a href="{% url 'accounts:wardrobe' %}" class="px-3 py-2 text-driftwood hover:text-teal rounded-lg hover:bg-vanilla/30">Wardrobe</a>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-5 sm:px-8 py-10 relative z-10">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-sand/30 bg-linen relative z-10 py-8">
        <div class="max-w-6xl mx-auto px-5 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs font-mono text-driftwood">
            <div class="flex items-center gap-2.5">
                <span class="font-sans font-bold tracking-[0.15em] text-coffee">DRYDOWN</span>
                <span class="text-sand">·</span>
                <span class="tracking-wide">Perfume Vault</span>
            </div>
            <div class="text-[11px] tracking-wider">
                &copy; {% now "Y" %} drydown.space
            </div>
        </div>
    </footer>

    {% block modal %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
