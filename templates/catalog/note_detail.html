{% extends "base.html" %}

{% block title %}{{ note.name }} — DRYDOWN{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <nav class="flex items-center gap-2 text-[11px] font-mono text-driftwood">
        <a href="{% url 'catalog:note_list' %}" class="hover:text-teal transition-colors">Notes</a>
        <span class="text-sand">/</span>
        <span class="text-coffee">{{ note.name }}</span>
    </nav>

    <div class="flex items-center justify-between">
        <h1 class="font-sans text-3xl font-bold text-coffee tracking-tight">{{ note.name }}</h1>
        <div class="flex items-center gap-2">
            <a href="{% url 'catalog:note_update' pk=note.pk %}" class="px-4 py-2 text-[11px] font-mono font-semibold uppercase bg-teal text-linen rounded-full hover:bg-teal-light transition-colors">Edit</a>
            <a href="{% url 'catalog:note_delete' pk=note.pk %}" class="px-4 py-2 text-[11px] font-mono font-semibold uppercase text-driftwood border border-sand/50 rounded-full hover:border-red-300 hover:text-red-500 transition-colors">Delete</a>
        </div>
    </div>

    <p class="font-mono text-sm text-driftwood">This note appears in fragrances as a top, heart, or base note ingredient.</p>
</div>
{% endblock %}
