{% for fragrance in fragrances %}
<a href="{% url 'catalog:fragrance_detail' pk=fragrance.pk %}" class="group block bg-linen rounded-lg overflow-hidden transition-colors duration-300 ease-luxury card-warm">
    <div>
        <!-- Bottle Image -->
        <div class="aspect-[3/4] flex items-center justify-center overflow-hidden p-6 bg-linen/60">
            {% if fragrance.source_image_url %}
            <img src="{% url 'catalog:fragrance_image' pk=fragrance.pk %}" alt="{{ fragrance.name }}" loading="lazy" decoding="async" class="img-warm-tint w-full h-full object-contain object-bottom transition-transform duration-300 ease-luxury group-hover:scale-105">
            {% else %}
            <span class="font-serif text-3xl italic text-sand/80">{{ fragrance.name|slice:":1" }}</span>
            {% endif %}
        </div>
        <!-- Info -->
        <div class="p-4 space-y-1 border-t border-sand/40">
            <p class="font-label text-[10px] uppercase tracking-[0.25em] text-tobacco truncate">{{ fragrance.house.name }}</p>
            <h3 class="font-serif text-[15px] text-espresso group-hover:text-brass transition-colors duration-300 ease-luxury truncate">{{ fragrance.name }}</h3>
            <p class="font-sans text-[10px] text-tobacco/80">{{ fragrance.gender }}{% if fragrance.release_year %} · {{ fragrance.release_year }}{% endif %}</p>
        </div>
    </div>
</a>
{% endfor %}
