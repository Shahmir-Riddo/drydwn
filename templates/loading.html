<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRYDOWN</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #F5F0E8;
            overflow: hidden;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mark {
            position: relative;
            width: 34px;
            height: 96px;
        }
        .vial {
            width: 100%;
            height: 100%;
            border: 1.5px solid #2C2118;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .dropper {
            position: absolute;
            top: -24px;
            right: -8px;
            width: 6px;
            height: 40px;
            background: #2C2118;
            border-radius: 3px;
            transform: rotate(40deg);
            transform-origin: bottom center;
        }
        .dropper-bulb {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 13px;
            height: 13px;
            background: #B8963E;
            border-radius: 50%;
        }
        .dropper-drop {
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: #B8963E;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="mark">
        <div class="vial"></div>
        <div class="dropper">
            <span class="dropper-bulb"></span>
            <span class="dropper-drop"></span>
        </div>
    </div>
</body>
</html>
