<div id="shelf3d-root">
    {{ shelf_items|json_script:"shelf3d-data" }}
    {% if is_own %}
    <form id="shelf3d-remove-form" method="POST" style="display:none;">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}">
    </form>
    {% endif %}
    <div class="shelf3d-scene" id="shelf3d-scene">
        <div class="shelf3d-shelves" id="shelf3d-shelves"></div>
    </div>
</div>

<style>
    /* 3D Shelf Display — clean geometric floating shelves.
       Row density: 3 items/shelf on mobile, 6 on desktop. */
    .shelf3d-scene {
        position: relative;
        width: 100%;
        padding: 2rem 2.5rem 3rem;
        perspective: 1400px;
    }

    .shelf3d-shelves {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 3.5rem;
    }

    .shelf3d-row {
        transform-style: preserve-3d;
        transform: rotateX(8deg);
        transform-origin: 50% 100%;
    }

    .shelf3d-items {
        position: relative;
        z-index: 5;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 75px;
        padding: 0 1rem 0;
        margin-bottom: -6px;
        flex-wrap: nowrap;
    }
    .shelf3d-items.is-dense {
        gap: 75px;
    }

    .shelf3d-item {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .shelf3d-item:hover {
        transform: translateY(-4px);
    }
    .shelf3d-item-remove {
        position: absolute;
        top: -10px;
        right: -10px;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: transparent;
        border: none;
        color: #A9683D;
        font-family: 'Outfit', sans-serif;
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.2s ease, color 0.2s ease;
        z-index: 3;
    }
    .shelf3d-item:hover .shelf3d-item-remove,
    .shelf3d-item-remove:focus {
        opacity: 1;
    }
    .shelf3d-item-remove:hover {
        color: #8C5530;
    }
    .shelf3d-item img {
        display: block;
        width: auto;
        object-fit: contain;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
    }
    .shelf3d-item-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 90px;
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-size: 1.75rem;
        color: #A9683D;
        background: #F4F3F0;
        border: 1px solid #E8E6E1;
        border-radius: 4px;
    }

    /* The plank: clean geometric shelf with architectural feel */
    .shelf3d-plank {
        position: relative;
        width: 100%;
        padding: 0 20px;
        background: transparent;
    }
    .shelf3d-plank:after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 40px;
        right: 40px;
        height: 10px;
        border-radius: 50%;
        background: rgba(0,0,0,0.08);
        filter: blur(6px);
        z-index: -1;
    }
    .shelf3d-plank > div {
        border-bottom: 24px solid #D4D0C8;
        position: relative;
        z-index: 1;
    }
    .shelf3d-plank > div:before {
        content: "";
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 0 0 24px 20px;
        border-color: transparent transparent #C0BCB4 transparent;
        position: absolute;
        bottom: -24px;
        left: -20px;
        z-index: 2;
    }
    .shelf3d-plank > div:after {
        content: "";
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 24px 0 0 20px;
        border-color: transparent transparent transparent #B0ACA4;
        position: absolute;
        bottom: -24px;
        right: -20px;
        z-index: 2;
    }
</style>

<script>
(function () {
    var dataEl = document.getElementById('shelf3d-data');
    if (!dataEl) return;
    var items = JSON.parse(dataEl.textContent);

    var shelvesEl = document.getElementById('shelf3d-shelves');

    var DENSITY = {
        sparse: { imgHeight: 115 },
        dense:  { imgHeight: 96 },
    };

    var currentCapacity = null;

    function capacityForViewport() {
        return window.innerWidth < 768 ? 3 : 6;
    }

    function chunk(arr, size) {
        var groups = [];
        for (var i = 0; i < arr.length; i += size) {
            groups.push(arr.slice(i, i + size));
        }
        return groups.length ? groups : [[]];
    }

    function buildItem(item, tier) {
        var a = document.createElement('a');
        a.className = 'shelf3d-item';
        a.href = item.detailUrl;
        a.title = item.name + ' — ' + item.house;

        if (item.imageUrl) {
            var img = document.createElement('img');
            img.src = item.imageUrl;
            img.alt = item.name;
            img.loading = 'lazy';
            img.style.height = tier.imgHeight + 'px';
            img.style.maxWidth = Math.round(tier.imgHeight * 0.65) + 'px';
            a.appendChild(img);
        } else {
            var fallback = document.createElement('div');
            fallback.className = 'shelf3d-item-fallback';
            fallback.style.height = tier.imgHeight + 'px';
            fallback.textContent = item.name.slice(0, 1);
            a.appendChild(fallback);
        }

        {% if is_own %}
        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'shelf3d-item-remove';
        removeBtn.title = 'Remove from wardrobe';
        removeBtn.setAttribute('aria-label', 'Remove ' + item.name + ' from wardrobe');
        removeBtn.textContent = '−';
        removeBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (!confirm('Remove "' + item.name + '" from your wardrobe?')) return;
            var form = document.getElementById('shelf3d-remove-form');
            form.action = item.removeUrl;
            form.submit();
        });
        a.appendChild(removeBtn);
        {% endif %}

        return a;
    }

    function buildShelf(shelfItems, density) {
        var tier = DENSITY[density];

        var row = document.createElement('div');
        row.className = 'shelf3d-row';

        var itemsWrap = document.createElement('div');
        itemsWrap.className = 'shelf3d-items' + (density === 'dense' ? ' is-dense' : '');
        shelfItems.forEach(function (item) {
            itemsWrap.appendChild(buildItem(item, tier));
        });
        row.appendChild(itemsWrap);

        var plank = document.createElement('div');
        plank.className = 'shelf3d-plank';
        plank.appendChild(document.createElement('div'));
        row.appendChild(plank);

        return row;
    }

    function render() {
        var capacity = capacityForViewport();
        if (capacity === currentCapacity) return;
        currentCapacity = capacity;
        var density = capacity <= 3 ? 'sparse' : 'dense';

        var groups = chunk(items, capacity);

        shelvesEl.innerHTML = '';
        groups.forEach(function (group) {
            shelvesEl.appendChild(buildShelf(group, density));
        });
    }

    render();

    var resizeTimer;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 200);
    });
})();
</script>
