<!-- ALPINE.JS LOG SCENT MODAL COMPONENT -->
<div 
    x-data="scentLogModal"
    @open-scent-modal.window="openModal()"
    @keydown.escape.window="open = false"
    class="relative z-50"
>
    <!-- BACKDROP FADE -->
    <div 
        x-show="open" 
        x-transition:enter="transition ease-luxury duration-500"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-luxury duration-500"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-tuxedo/70 backdrop-blur-xs"
        @click="open = false"
        style="display: none;"
    ></div>

    <!-- MODAL CONTAINER -->
    <div 
        x-show="open" 
        x-transition:enter="transition ease-luxury duration-500"
        x-transition:enter-start="opacity-0 translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-luxury duration-500"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 translate-y-2"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto pointer-events-none"
        style="display: none;"
    >
        <div 
            class="w-full max-w-lg bg-cream border border-sand p-6 sm:p-8 space-y-6 pointer-events-auto relative text-espresso font-sans max-h-[90vh] overflow-y-auto rounded-xl shadow-lg"
            @click.stop
        >
            <!-- HEADER -->
            <div class="flex items-center justify-between border-b border-sand/40 pb-4">
                <div class="space-y-1">
                    <p class="font-label text-[10px] uppercase tracking-[0.25em] text-brass font-semibold">Private Journal</p>
                    <h3 class="font-serif text-2xl font-medium text-tuxedo italic">
                        Log Today's Wear
                    </h3>
                </div>

                <button 
                    @click="open = false" 
                    type="button"
                    class="text-sand hover:text-tobacco transition-colors duration-300"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- GLOBAL ERRORS -->
            <template x-if="errors.__all__">
                <div class="text-[12px] font-sans text-red-700 bg-red-50 border border-red-200 px-3 py-2 rounded">
                    <template x-for="e in errors.__all__" :key="e"><p x-text="e"></p></template>
                </div>
            </template>

            <!-- FORM -->
            <form @submit.prevent="submitLog()" class="space-y-6">

                <!-- FRAGRANCE SEARCH -->
                <div class="space-y-1.5 relative">
                    <label class="block font-label text-[11px] uppercase tracking-[0.15em] text-tobacco font-semibold">
                        Fragrance
                    </label>

                    <!-- Selected display -->
                    <template x-if="fragranceId">
                        <div class="flex items-center justify-between border border-sand bg-linen rounded-lg p-3">
                            <div>
                                <p class="font-serif text-sm text-tuxedo" x-text="fragranceName"></p>
                                <p class="font-label text-[10px] uppercase tracking-[0.15em] text-tobacco" x-text="fragranceHouse"></p>
                            </div>
                            <button type="button" @click="clearFragrance()" class="text-tobacco hover:text-red-700 transition-colors p-1 rounded">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                    </template>

                    <!-- Search input -->
                    <template x-if="!fragranceId">
                        <div class="relative">
                            <input
                                type="text"
                                x-model="fragranceQuery"
                                @input.debounce.300ms="searchFragrances()"
                                @focus="if (fragranceQuery.trim().length >= 2) searchOpen = true"
                                placeholder="Search by name or house…"
                                class="w-full bg-linen text-espresso font-sans text-xs border border-sand rounded-lg px-3 py-2.5 focus:border-brass focus:outline-none transition-colors"
                            >
                            <!-- Dropdown -->
                            <div
                                x-show="searchOpen"
                                @click.outside="searchOpen = false"
                                x-transition
                                class="absolute left-0 right-0 top-full mt-1 bg-cream border border-sand z-50 max-h-48 overflow-y-auto rounded-lg shadow-md"
                                style="display: none;"
                            >
                                <template x-if="searchLoading && fragranceResults.length === 0">
                                    <div class="px-4 py-3 text-[11px] font-sans text-tobacco">Searching…</div>
                                </template>
                                <template x-if="!searchLoading && fragranceResults.length === 0 && fragranceQuery.trim().length >= 2">
                                    <div class="px-4 py-3 text-[11px] font-sans text-tobacco text-center">
                                        No fragrances found for "<span x-text="fragranceQuery" class="text-espresso"></span>"
                                    </div>
                                </template>
                                <template x-for="item in fragranceResults" :key="item.id">
                                    <button
                                        type="button"
                                        @click="selectFragrance(item)"
                                        class="w-full flex items-center gap-3 px-4 py-2.5 hover:bg-linen transition-colors duration-300 ease-luxury text-left border-b border-sand/30 last:border-b-0"
                                    >
                                        <div class="w-7 h-7 bg-linen flex items-center justify-center shrink-0 overflow-hidden rounded">
                                            <template x-if="item.image_url">
                                                <img :src="item.image_url" :alt="item.name" class="w-full h-full object-contain p-0.5">
                                            </template>
                                            <template x-if="!item.image_url">
                                                <span class="font-label text-[9px] text-tobacco uppercase" x-text="item.name.charAt(0)"></span>
                                            </template>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="text-[13px] font-serif text-espresso truncate" x-text="item.name"></div>
                                            <div class="text-[10px] font-label uppercase tracking-[0.15em] text-tobacco truncate" x-text="item.house"></div>
                                        </div>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Error -->
                    <template x-if="errors.fragrance">
                        <p class="text-[11px] text-red-600 mt-1" x-text="errors.fragrance[0]"></p>
                    </template>
                </div>

                <!-- WEAR DATE & OCCASION ROW -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Wear Date -->
                    <div class="space-y-1.5">
                        <label class="block font-label text-[11px] uppercase tracking-[0.15em] text-tobacco font-semibold">
                            Wear Date
                        </label>
                        <input 
                            type="date" 
                            x-model="wearDate"
                            class="w-full bg-linen text-espresso font-sans text-xs border border-sand rounded-lg px-3 py-2 focus:border-brass focus:outline-none transition-colors"
                        >
                        <template x-if="errors.wear_date">
                            <p class="text-[11px] text-red-600 mt-1" x-text="errors.wear_date[0]"></p>
                        </template>
                    </div>

                    <!-- Occasion -->
                    <div class="space-y-1.5">
                        <label class="block font-label text-[11px] uppercase tracking-[0.15em] text-tobacco font-semibold">
                            Occasion
                        </label>
                        <select 
                            x-model="occasion"
                            class="w-full bg-linen text-espresso font-sans text-xs border border-sand rounded-lg px-3 py-2 focus:border-brass focus:outline-none transition-colors cursor-pointer"
                        >
                            <option value="Casual">Casual</option>
                            <option value="Work">Work</option>
                            <option value="Evening">Evening</option>
                            <option value="Formal">Formal</option>
                            <option value="Special">Special Occasion</option>
                        </select>
                    </div>
                </div>

                <!-- SPRAYS APPLIED & RATING -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
                    <!-- Sprays Applied -->
                    <div class="space-y-2">
                        <label class="block font-label text-[11px] uppercase tracking-[0.15em] text-tobacco font-semibold">
                            Sprays Applied
                        </label>
                        <div class="flex items-center justify-between border border-sand bg-linen rounded-lg px-3 py-1.5">
                            <button 
                                type="button" 
                                @click="if (sprays > 1) sprays--"
                                class="font-serif text-lg text-tobacco hover:text-tuxedo px-2 transition-colors"
                            >
                                —
                            </button>

                            <div class="font-serif text-base italic text-tuxedo">
                                <span x-text="sprays"></span> <span class="font-label text-xs uppercase not-italic tracking-[0.15em] text-tobacco">Sprays</span>
                            </div>

                            <button 
                                type="button" 
                                @click="if (sprays < 20) sprays++"
                                class="font-serif text-lg text-tobacco hover:text-tuxedo px-2 transition-colors"
                            >
                                +
                            </button>
                        </div>
                    </div>

                    <!-- Rating Dots -->
                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <label class="font-label text-[11px] uppercase tracking-[0.15em] text-tobacco font-semibold">Rating</label>
                            <span class="font-serif italic text-xs text-brass" x-text="rating + ' / 5'"></span>
                        </div>
                        
                        <div class="flex items-center gap-3 border border-sand bg-linen rounded-lg px-3 py-2.5 h-[42px]">
                            <template x-for="dot in [1, 2, 3, 4, 5]" :key="dot">
                                <button 
                                    type="button" 
                                    @click="rating = dot"
                                    class="p-0.5 focus:outline-none transition-transform hover:scale-110"
                                >
                                    <span 
                                        class="block transition-all duration-300"
                                        :class="rating >= dot ? 'dot-filled' : 'dot-hollow'"
                                    ></span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- SILLAGE & LONGEVITY ROW -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Sillage -->
                    <div class="space-y-1.5 bg-linen border border-sand/40 rounded-lg p-3">
                        <div class="flex items-center justify-between">
                            <label class="font-label text-[10px] uppercase tracking-[0.15em] text-tobacco font-semibold">Sillage</label>
                            <span class="font-serif italic text-xs text-brass" x-text="sillageRating + ' / 5'"></span>
                        </div>
                        <input 
                            type="range" 
                            min="1" max="5" step="1"
                            x-model.number="sillageRating"
                            class="w-full h-[1px] bg-sand appearance-none cursor-pointer accent-brass [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-brass"
                        >
                        <div class="flex justify-between text-[9px] font-label uppercase tracking-wider text-tobacco/60">
                            <span>Intimate</span>
                            <span>Beast</span>
                        </div>
                    </div>

                    <!-- Longevity -->
                    <div class="space-y-1.5 bg-linen border border-sand/40 rounded-lg p-3">
                        <div class="flex items-center justify-between">
                            <label class="font-label text-[10px] uppercase tracking-[0.15em] text-tobacco font-semibold">Longevity</label>
                            <span class="font-serif italic text-xs text-brass" x-text="longevityHours + 'h'"></span>
                        </div>
                        <input 
                            type="range" 
                            min="1" max="24" step="1"
                            x-model.number="longevityHours"
                            class="w-full h-[1px] bg-sand appearance-none cursor-pointer accent-brass [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-brass"
                        >
                        <div class="flex justify-between text-[9px] font-label uppercase tracking-wider text-tobacco/60">
                            <span>1h</span>
                            <span>24h</span>
                        </div>
                    </div>
                </div>

                <!-- OBSERVATIONS -->
                <div class="space-y-1.5">
                    <label class="block font-label text-[11px] uppercase tracking-[0.15em] text-tobacco font-semibold">
                        Olfactory Observations
                    </label>
                    <textarea 
                        x-model="reviewText"
                        rows="3"
                        placeholder="Log drydown details, performance nuances, location notes..."
                        class="w-full bg-linen text-espresso font-serif italic text-sm border border-sand rounded-lg px-3 py-2 placeholder-tobacco/50 focus:border-brass focus:outline-none transition-colors resize-none"
                    ></textarea>
                </div>

                <!-- FAVORITE TOGGLE -->
                <div class="flex items-center justify-between py-1 bg-linen border border-sand/40 rounded-lg px-3">
                    <span class="font-label text-[11px] uppercase tracking-[0.15em] text-tobacco font-semibold">
                        Standout Wear
                    </span>
                    <button 
                        type="button"
                        @click="isFavorite = !isFavorite"
                        class="transition-all duration-300 p-1 rounded-md border border-sand"
                        :class="isFavorite ? 'bg-brass/10 border-brass text-brass scale-105' : 'bg-white text-sand hover:text-tobacco'"
                    >
                        <svg class="w-5 h-5" :fill="isFavorite ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                        </svg>
                    </button>
                </div>

                <!-- ACTIONS -->
                <div class="pt-4 flex items-center justify-end gap-4 border-t border-sand/40">
                    <button 
                        type="button" 
                        @click="open = false" 
                        class="font-label text-[11px] uppercase tracking-[0.2em] text-tobacco hover:text-tuxedo transition-colors"
                    >
                        Cancel
                    </button>

                    <button 
                        type="submit"
                        :disabled="submitting"
                        class="font-label text-[11px] uppercase tracking-[0.2em] text-white bg-navy px-5 py-2.5 rounded hover:bg-navy/90 transition-all duration-500 ease-luxury shadow shadow-sm disabled:opacity-40 disabled:cursor-not-allowed"
                    >
                        <span x-show="!submitting">Save Log Entry</span>
                        <span x-show="submitting" style="display: none;">Saving…</span>
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('scentLogModal', () => ({
        open: false,
        submitting: false,
        errors: {},

        fragranceQuery: '',
        fragranceResults: [],
        fragranceId: null,
        fragranceName: '',
        fragranceHouse: '',
        searchOpen: false,
        searchLoading: false,

        wearDate: new Date().toISOString().slice(0, 10),
        rating: 4,
        sprays: 3,
        occasion: 'Casual',
        sillageRating: 3,
        longevityHours: 6,
        reviewText: '',
        isFavorite: false,

        openModal() {
            this.resetForm();
            this.open = true;
        },

        resetForm() {
            this.fragranceQuery = '';
            this.fragranceResults = [];
            this.fragranceId = null;
            this.fragranceName = '';
            this.fragranceHouse = '';
            this.searchOpen = false;
            this.wearDate = new Date().toISOString().slice(0, 10);
            this.rating = 4;
            this.sprays = 3;
            this.occasion = 'Casual';
            this.sillageRating = 3;
            this.longevityHours = 6;
            this.reviewText = '';
            this.isFavorite = false;
            this.errors = {};
            this.submitting = false;
        },

        async searchFragrances() {
            if (this.fragranceQuery.trim().length < 2) {
                this.fragranceResults = [];
                this.searchOpen = false;
                return;
            }
            this.searchLoading = true;
            this.searchOpen = true;
            try {
                const res = await fetch('/api/search/?q=' + encodeURIComponent(this.fragranceQuery));
                const data = await res.json();
                this.fragranceResults = data.results || [];
            } catch (err) {
                this.fragranceResults = [];
            } finally {
                this.searchLoading = false;
            }
        },

        selectFragrance(item) {
            this.fragranceId = item.id;
            this.fragranceName = item.name;
            this.fragranceHouse = item.house;
            this.fragranceQuery = item.name;
            this.searchOpen = false;
            this.fragranceResults = [];
            delete this.errors.fragrance;
        },

        clearFragrance() {
            this.fragranceId = null;
            this.fragranceName = '';
            this.fragranceHouse = '';
            this.fragranceQuery = '';
        },

        getCookie(name) {
            let v = null;
            document.cookie.split(';').forEach(function(c) {
                c = c.trim();
                if (c.startsWith(name + '=')) {
                    v = decodeURIComponent(c.substring(name.length + 1));
                }
            });
            return v;
        },

        async submitLog() {
            this.errors = {};

            if (!this.fragranceId) {
                this.errors.fragrance = ['Please select a fragrance.'];
                return;
            }
            if (!this.wearDate) {
                this.errors.wear_date = ['Please select a date.'];
                return;
            }

            this.submitting = true;
            const formData = new FormData();
            formData.append('fragrance', this.fragranceId);
            formData.append('wear_date', this.wearDate);
            formData.append('rating', this.rating);
            formData.append('occasion', this.occasion);
            formData.append('sprays', this.sprays);
            formData.append('sillage_rating', this.sillageRating);
            formData.append('longevity_hours', this.longevityHours);
            formData.append('review_text', this.reviewText);
            if (this.isFavorite) formData.append('is_favorite', 'on');

            try {
                const res = await fetch('{% url "diary:scent_log_create" %}', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': this.getCookie('csrftoken'),
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    body: formData,
                });
                const data = await res.json();
                if (data.success) {
                    this.open = false;
                    this.resetForm();
                    window.location.href = data.redirect_url;
                } else {
                    this.errors = data.errors || {};
                    this.submitting = false;
                }
            } catch (err) {
                this.errors = { __all__: ['Something went wrong. Please try again.'] };
                this.submitting = false;
            }
        }
    }));
});
</script>
