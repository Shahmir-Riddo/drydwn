<!-- ALPINE.JS INITIALIZING SCENT LOG MODAL COMPONENT -->
<div 
    x-data="{ 
        open: false, 
        rating: 4.0, 
        hoverRating: 0,
        sprays: 3, 
        occasion: 'Daily Wear', 
        notes: '' 
    }"
    @open-scent-modal.window="open = true"
    @keydown.escape.window="open = false"
    class="relative z-50"
>
    <!-- BACKDROP FADE (150ms smooth transition) -->
    <div 
        x-show="open" 
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-obsidian/90 backdrop-blur-md"
        @click="open = false"
        style="display: none;"
    ></div>

    <!-- MODAL DIALOG CONTAINER (150ms fade + zoom transition) -->
    <div 
        x-show="open" 
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 scale-95 translate-y-2"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 scale-100 translate-y-0"
        x-transition:leave-end="opacity-0 scale-95 translate-y-2"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto pointer-events-none"
        style="display: none;"
    >
        <div 
            class="w-full max-w-lg bg-[#111115] border border-[#22222a] shadow-2xl shadow-black p-6 sm:p-8 space-y-6 pointer-events-auto relative text-bone font-sans"
            @click.stop
        >
            <!-- TOP BAR HEADER -->
            <div class="flex items-center justify-between border-b border-[#22222a] pb-4">
                <div class="space-y-1">
                    <div class="flex items-center gap-2 font-mono text-[10px] uppercase text-resin-500 tracking-widest font-bold">
                        <span class="w-1.5 h-1.5 bg-resin-500 rounded-full animate-pulse"></span>
                        INITIALIZING SCENT LOG
                    </div>
                    <h3 class="font-serif text-xl font-bold tracking-wide uppercase text-bone">
                        Log Today's Wear
                    </h3>
                </div>

                <button 
                    @click="open = false" 
                    type="button"
                    class="p-1.5 text-mist hover:text-bone hover:bg-[#08080a] border border-transparent hover:border-[#22222a] transition-colors"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- FORM BODY -->
            <form @submit.prevent="open = false" class="space-y-5">
                
                <!-- MISSION CONTEXT (OCCASION) -->
                <div class="space-y-2">
                    <label class="block font-mono text-xs uppercase tracking-widest text-mist font-semibold">
                        Mission Context (Occasion)
                    </label>
                    <select 
                        x-model="occasion"
                        class="w-full bg-[#08080a] text-bone font-mono text-xs border border-[#22222a] focus:outline-none focus:border-resin-500 px-3.5 py-2.5 uppercase transition-colors"
                    >
                        <option value="Daily Wear">Daily Wear</option>
                        <option value="Office Mission">Office Mission</option>
                        <option value="Evening / Date Night">Evening / Date Night</option>
                        <option value="Black Tie / Formal">Black Tie / Formal</option>
                    </select>
                </div>

                <!-- SPRAYS APPLIED STEP COUNTER -->
                <div class="space-y-2">
                    <label class="block font-mono text-xs uppercase tracking-widest text-mist font-semibold">
                        Sprays Applied
                    </label>
                    <div class="flex items-center gap-4 bg-[#08080a] border border-[#22222a] p-2 justify-between">
                        <button 
                            type="button" 
                            @click="if (sprays > 1) sprays--"
                            class="w-10 h-10 bg-[#111115] hover:bg-[#22222a] text-bone font-mono text-lg font-bold border border-[#22222a] flex items-center justify-center transition-colors select-none"
                        >
                            -
                        </button>

                        <div class="font-mono text-sm font-bold tracking-widest text-bone">
                            <span x-text="sprays" class="text-resin-500 text-lg"></span> <span class="text-mist text-xs">SPRAYS</span>
                        </div>

                        <button 
                            type="button" 
                            @click="sprays++"
                            class="w-10 h-10 bg-[#111115] hover:bg-[#22222a] text-bone font-mono text-lg font-bold border border-[#22222a] flex items-center justify-center transition-colors select-none"
                        >
                            +
                        </button>
                    </div>
                </div>

                <!-- STAR RATING IN WARM AMBER (#e58e26) -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between font-mono text-xs">
                        <label class="uppercase tracking-widest text-mist font-semibold">Star Rating</label>
                        <span class="text-resin-500 font-bold" x-text="rating + ' / 5.0'"></span>
                    </div>
                    
                    <div class="flex items-center gap-2 bg-[#08080a] border border-[#22222a] p-3 justify-center">
                        <template x-for="star in [1, 2, 3, 4, 5]" :key="star">
                            <button 
                                type="button" 
                                @click="rating = star"
                                @mouseenter="hoverRating = star"
                                @mouseleave="hoverRating = 0"
                                class="p-1 focus:outline-none transition-transform hover:scale-110"
                            >
                                <svg 
                                    class="w-7 h-7 transition-colors duration-150" 
                                    :class="(hoverRating || rating) >= star ? 'text-[#e58e26] fill-[#e58e26]' : 'text-[#22222a] fill-transparent'" 
                                    viewBox="0 0 24 24" 
                                    stroke="currentColor" 
                                    stroke-width="1.5"
                                >
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
                                </svg>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- BRIEFING NOTES WITH SUBTLE BORDER TRANSITION ON FOCUS -->
                <div class="space-y-2">
                    <label class="block font-mono text-xs uppercase tracking-widest text-mist font-semibold">
                        Briefing Notes
                    </label>
                    <textarea 
                        x-model="notes"
                        rows="3"
                        placeholder="Log olfactory observations (e.g. Heavy vanilla & roasted coffee opening...)"
                        class="w-full bg-[#08080a] text-bone font-mono text-xs border border-[#22222a] focus:outline-none focus:border-[#e58e26] p-3 placeholder-mist/60 transition-colors duration-200"
                    ></textarea>
                </div>

                <!-- SUBMIT / CANCEL BUTTONS -->
                <div class="pt-2 flex items-center justify-end gap-3">
                    <button 
                        type="button" 
                        @click="open = false" 
                        class="px-5 py-2.5 font-mono text-xs uppercase text-mist hover:text-bone border border-[#22222a] hover:bg-[#08080a] transition-colors"
                    >
                        CANCEL
                    </button>

                    <button 
                        type="submit" 
                        class="px-6 py-2.5 bg-resin-500 hover:bg-resin-600 text-obsidian font-mono text-xs font-bold uppercase tracking-widest shadow-lg shadow-resin-500/20 transition-all"
                    >
                        SAVE DOSSIER ENTRY
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
